<section id="contact" class="py-28 px-6">

  <div data-aos="zoom-in-up"
       class="max-w-5xl mx-auto rounded-[2rem] border border-white/10 bg-white/[0.04] p-10 lg:p-16 text-center relative overflow-hidden">

    <div class="absolute w-[400px] h-[400px] bg-cyan-400/10 blur-[120px] rounded-full left-1/2 -translate-x-1/2 top-[-200px]"></div>

    <div class="relative z-10">

      <p class="text-cyan-400 mb-3">Let’s build something</p>

      <h2 class="text-4xl lg:text-6xl font-bold mb-6">
        Ready to launch your next website?
      </h2>

      <p class="text-gray-400 max-w-2xl mx-auto mb-8">
        Tell us about your idea and we’ll help turn it into a modern, responsive and high-performing web experience.
      </p>

      <button
        type="button"
        (click)="openContactModal()"
        class="inline-flex bg-cyan-400 text-black px-8 py-4 rounded-full font-semibold
        hover:scale-105 transition duration-300
        hover:shadow-[0_0_20px_rgba(34,211,238,0.6)]
        hover:drop-shadow-[0_0_10px_rgba(34,211,238,0.8)]
        hover:bg-cyan-300"
      >
        Contact Echo Solutions
      </button>

    </div>
  </div>
</section>

<!-- MODAL -->
<div
  *ngIf="contactOpen && !success"
  (click)="closeContactModal()"
  class="fixed inset-0 z-[999] flex items-center justify-center bg-black/70 backdrop-blur-sm px-6"
>

  <div
    (click)="$event.stopPropagation()"
    class="bg-[#0B1120] border border-cyan-400/20 rounded-3xl w-full max-w-2xl p-8 relative shadow-2xl"
  >

    <button
      type="button"
      (click)="closeContactModal()"
      class="absolute top-5 right-5 text-gray-400 hover:text-white text-2xl"
    >
      ✕
    </button>

    <h2 class="text-3xl font-bold mb-6 text-cyan-300">
      Contact Us
    </h2>

    <!-- FORM -->
    <form
      #f="ngForm"
      (ngSubmit)="sendMessage(f)"
      class="space-y-5"
    >

      <!-- NAME -->
      <input
        name="name"
        ngModel
        required
        type="text"
        placeholder="Your name"
        class="w-full px-5 py-3 rounded-2xl bg-white/5 border border-white/10 text-white outline-none focus:border-cyan-400/50"
      />

      <!-- EMAIL -->
      <input
        name="email"
        ngModel
        required
        email
        type="email"
        placeholder="Your email"
        class="w-full px-5 py-3 rounded-2xl bg-white/5 border border-white/10 text-white outline-none focus:border-cyan-400/50"
      />

      <!-- TYPE (FIXED COLOR ISSUE) -->
      <select
        name="type"
        ngModel
        required
        class="w-full px-5 py-3 rounded-2xl bg-[#0B1120] border border-white/10 text-white outline-none focus:border-cyan-400/50"
      >
        <option value="">Select inquiry type</option>
        <option>Question</option>
        <option>Business Inquiry</option>
        <option>Need a Website</option>
        <option>SaaS / App</option>
        <option>Job / Collaboration</option>
      </select>

      <!-- MESSAGE -->
      <textarea
        name="message"
        ngModel
        required
        rows="5"
        placeholder="Message"
        class="w-full px-5 py-3 rounded-2xl bg-white/5 border border-white/10 text-white outline-none focus:border-cyan-400/50"
      ></textarea>

      <!-- BUTTON -->
      <button
        type="submit"
        [disabled]="f.invalid || loading"
        class="w-full bg-cyan-400 text-black py-3 rounded-2xl font-semibold
        hover:scale-105 transition
        disabled:opacity-50 disabled:cursor-not-allowed"
      >

        <span *ngIf="!loading">Send Message</span>

        <span *ngIf="loading" class="flex items-center justify-center gap-2">
          <div class="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
          Sending message...
        </span>

      </button>

    </form>

  </div>
</div>

<!-- SUCCESS MODAL -->
<div
  *ngIf="success"
  class="fixed inset-0 z-[999] flex items-center justify-center bg-black/70 backdrop-blur-sm px-6"
>

  <div class="bg-[#0B1120] border border-cyan-400/20 rounded-3xl w-full max-w-md p-8 text-center relative">

    <button
      type="button"
      (click)="closeSuccess()"
      class="absolute top-5 right-5 text-gray-400 hover:text-white text-2xl"
    >
      ✕
    </button>

    <h2 class="text-2xl font-bold text-cyan-300 mb-4">
      Message Sent Successfully
    </h2>

    <p class="text-gray-400">
      We’ll get back to you as soon as possible.
    </p>

  </div>

</div>
