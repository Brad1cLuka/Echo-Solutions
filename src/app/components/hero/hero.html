<section id="home" class="min-h-screen flex items-center justify-center px-4 sm:px-6 pt-36 lg:pt-40 relative overflow-hidden">

  <!-- GLOW -->
  <div class="absolute w-[500px] h-[500px] bg-cyan-500/20 blur-[120px] rounded-full top-[-100px] right-[-100px]"></div>

  <!-- CONTENT -->
  <div class="max-w-7xl w-full flex flex-col lg:flex-row items-center gap-14 lg:gap-20 relative z-10">

    <!-- LEFT -->
    <div
      data-aos="fade-right"
      class="w-full lg:w-1/2 text-center lg:text-left"
    >

      <p class="text-cyan-400 mb-4 text-base sm:text-lg">
        {{ 'HERO.TAGLINE' | translate }}
      </p>

      <h1 class="text-4xl sm:text-5xl lg:text-7xl font-bold leading-tight mb-6">
        {{ 'HERO.TITLE_LINE1' | translate }} <br>
        {{ 'HERO.TITLE_LINE2' | translate }} <br>
        {{ 'HERO.TITLE_LINE3' | translate }}
      </h1>

      <p class="text-gray-400 text-base sm:text-lg leading-relaxed mb-6 max-w-xl mx-auto lg:mx-0">
        {{ 'HERO.DESCRIPTION' | translate }}
      </p>

      <p class="text-gray-400 text-base sm:text-lg leading-relaxed mb-8 max-w-xl mx-auto lg:mx-0">
        {{ 'HERO.SUBTEXT' | translate }}
      </p>

      <!-- BUTTONS -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">

        <a
          href="#projects"
          class="bg-cyan-400 text-black px-8 py-4 rounded-full font-semibold hover:scale-105 transition duration-300 text-center"
        >
          {{ 'HERO.BUTTON_PROJECTS' | translate }}
        </a>

        <a
          href="#contact"
          class="border border-white/20 px-8 py-4 rounded-full hover:bg-white/10 transition duration-300 text-center"
        >
          {{ 'HERO.BUTTON_CONTACT' | translate }}
        </a>

      </div>

    </div>

    <!-- RIGHT -->
    <div
      data-aos="fade-left"
      class="relative flex justify-center w-full lg:w-1/2"
    >

      <!-- INNER GLOW -->
      <div class="absolute w-[350px] h-[350px] bg-cyan-400/20 blur-[120px] rounded-full"></div>

      <!-- IMAGE -->
      <div class="bg-[#0B1120] border border-white/10 rounded-3xl p-3 sm:p-4 shadow-2xl relative w-full max-w-[620px]">

        <img
          src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"
          alt="Modern Web Development"
          class="rounded-2xl w-full h-auto object-cover"
        />

      </div>

    </div>

  </div>

</section>
