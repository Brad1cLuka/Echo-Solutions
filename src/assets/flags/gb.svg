<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <rect width="640" height="480" fill="#012169"></rect>

  <!-- white diagonals -->
  <path d="M0 0 L640 480 M640 0 L0 480" stroke="#ffffff" stroke-width="80"></path>

  <!-- red diagonals -->
  <path d="M0 0 L640 480 M640 0 L0 480" stroke="#C8102E" stroke-width="40"></path>

  <!-- white cross -->
  <rect x="270" width="100" height="480" fill="#ffffff"></rect>
  <rect y="190" width="640" height="100" fill="#ffffff"></rect>

  <!-- red cross -->
  <rect x="290" width="60" height="480" fill="#C8102E"></rect>
  <rect y="210" width="640" height="60" fill="#C8102E"></rect>
</svg>